# Render Blueprint
#
# Render 대시보드에서 New > Blueprint 를 고르고 이 저장소를 선택하면
# 아래 정의대로 웹 서비스와 PostgreSQL이 한 번에 만들어집니다.
# DB 접속 정보는 fromDatabase 로 자동 주입되므로 직접 입력할 값이 없습니다.

databases:
  - name: javaquiz-db
    databaseName: javaquiz
    user: javaquiz
    plan: free

services:
  - type: web
    name: java-quiz-web
    runtime: docker
    plan: free
    rootDir: java-quiz-web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # PostgreSQL 프로필을 켭니다. (application-postgres.properties)
      - key: SPRING_PROFILES_ACTIVE
        value: postgres

      # 아래 네 개는 위에서 만든 DB에서 자동으로 채워집니다.
      - key: DB_HOST
        fromDatabase:
          name: javaquiz-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: javaquiz-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: javaquiz-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: javaquiz-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: javaquiz-db
          property: password

      - key: H2_CONSOLE
        value: "false"
