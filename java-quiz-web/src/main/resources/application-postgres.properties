# 배포 환경(PostgreSQL)에서만 켜지는 설정입니다.
# SPRING_PROFILES_ACTIVE=postgres 일 때 application.properties 위에 덧씌워집니다.
#
# Render 같은 호스팅은 DB 접속 정보를 host / port / database 로 따로 내려줍니다.
# 그래서 JDBC URL을 여기서 조립합니다. 로컬 H2 설정은 건드리지 않습니다.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 배포 환경에서는 H2 콘솔을 반드시 끕니다.
spring.h2.console.enabled=false
