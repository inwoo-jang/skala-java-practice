services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: javaquiz
      POSTGRES_USER: javaquiz
      POSTGRES_PASSWORD: local-password
    volumes:
      - quiz-db:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/javaquiz
      DB_USERNAME: javaquiz
      DB_PASSWORD: local-password
      H2_CONSOLE: "false"
    depends_on:
      - db
volumes:
  quiz-db:
